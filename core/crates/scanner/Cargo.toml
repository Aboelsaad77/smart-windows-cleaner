[package]
name = "sc-scanner"
version.workspace = true
edition = "2021"
description = "Fast Windows filesystem scanner with metadata cache, reparse point handling, and live-lock probing"

[dependencies]
ahash = "0.8"
fs2 = { workspace = true }
sc-file-models = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
]

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
