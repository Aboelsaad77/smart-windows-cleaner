[package]
name = "sc-cli"
version.workspace = true
edition = "2021"
description = "Command-line frontend and native core for Smart Cleaner"
default-run = "smart-cleaner-core"

[lib]
name = "sc_cli"
path = "src/lib.rs"

[[bin]]
name = "smart-cleaner-core"
path = "src/main.rs"

[[bin]]
name = "sc-cleaner"
path = "src/bin/sc-cleaner.rs"

[dependencies]
sc-file-models = { workspace = true }
sc-risk-engine = { workspace = true }
sc-safety-engine = { workspace = true }
sc-scanner = { workspace = true }

[dev-dependencies]
sc-db = { workspace = true }
sc-quarantine = { workspace = true }
fs2 = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3"
