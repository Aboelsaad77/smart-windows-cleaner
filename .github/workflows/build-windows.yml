name: Windows Release Build & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-and-package:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust & Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Rust Code Formatting Check
        run: cargo fmt --all -- --check
        working-directory: core

      - name: Rust Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core

      - name: Run Rust Test Suite
        run: cargo test --workspace
        working-directory: core

      - name: Build Rust Core Release Binary (smart-cleaner-core.exe)
        run: cargo build --release --bin smart-cleaner-core
        working-directory: core

      - name: Verify Built Rust Executable & PE Metadata
        shell: pwsh
        run: |
          $coreExe = "core\target\release\smart-cleaner-core.exe"
          if (-not (Test-Path $coreExe)) {
            Write-Error "Rust core binary not found at $coreExe"
            exit 1
          }
          Write-Host "Found Rust Core binary: $coreExe ($( (Get-Item $coreExe).Length ) bytes)"
          $versionInfo = (Get-Item $coreExe).VersionInfo
          Write-Host "PE ProductVersion : $($versionInfo.ProductVersion)"
          Write-Host "PE FileVersion    : $($versionInfo.FileVersion)"
          Write-Host "PE CompanyName    : $($versionInfo.CompanyName)"
          Write-Host "PE ProductName    : $($versionInfo.ProductName)"
          Write-Host "PE Description    : $($versionInfo.FileDescription)"
          if ($versionInfo.CompanyName -ne "Abdelrahman Aboelsaad") {
            Write-Error "CompanyName does not match expected value: $($versionInfo.CompanyName)"
            exit 1
          }
          if ($versionInfo.ProductName -ne "Smart Windows Cleaner") {
            Write-Error "ProductName does not match expected value: $($versionInfo.ProductName)"
            exit 1
          }

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: desktop

      - name: Frontend TypeScript Typecheck
        run: npm run typecheck
        working-directory: desktop

      - name: Run Frontend Vitest Suite
        run: npm test
        working-directory: desktop

      - name: Build Frontend & Transpile Electron
        run: npm run build
        working-directory: desktop

      - name: Package Windows Deliverables (NSIS & Portable ZIP)
        run: npm run package
        working-directory: desktop

      - name: Generate Release Manifests (latest.yml & portable.yml)
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $zip = "desktop/dist-release/SmartCleaner-Portable-$v.zip"
          $setup = "desktop/dist-release/SmartCleaner-Setup-$v.exe"
          if (Test-Path $zip) {
            node desktop/scripts/make-portable-yml.mjs $v $zip "desktop/dist-release/portable.yml"
          }
          if (Test-Path $setup) {
            node desktop/scripts/make-portable-yml.mjs $v $setup "desktop/dist-release/latest.yml"
          }

      - name: Compile Inno Setup Bootstrapper (ISCC)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup ISCC.exe not found on runner" }
          & $iscc installer\bootstrapper.iss
          if (-not (Test-Path desktop\dist-release\SmartCleaner-Setup.exe)) {
            throw "Bootstrapper binary desktop\dist-release\SmartCleaner-Setup.exe not produced"
          }
          Write-Host "Successfully compiled SmartCleaner-Setup.exe ($( (Get-Item desktop\dist-release\SmartCleaner-Setup.exe).Length ) bytes)"

      - name: Validate Bootstrapper Invariants & Assets on Windows
        shell: pwsh
        run: |
          $bootstrapper = "desktop/dist-release/SmartCleaner-Setup.exe"
          if (-not (Test-Path $bootstrapper)) { throw "Bootstrapper missing at $bootstrapper" }
          $info = (Get-Item $bootstrapper).VersionInfo
          Write-Host "Bootstrapper FileVersion: $($info.FileVersion)"
          Write-Host "Bootstrapper ProductVersion: $($info.ProductVersion)"
          Write-Host "Bootstrapper Size: $((Get-Item $bootstrapper).Length) bytes"
          
          # Test PowerShell Invoke-WebRequest to GitHub endpoints
          Write-Host "Verifying GitHub release endpoint accessibility..."
          $feedUrls = @(
            "https://github.com/Aboelsaad77/smart-windows-cleaner/releases/latest/download/portable.yml",
            "https://github.com/Aboelsaad77/smart-windows-cleaner/releases/latest/download/latest.yml"
          )
          foreach ($u in $feedUrls) {
            try {
              $resp = Invoke-WebRequest -Uri $u -Method Head -MaximumRedirection 5 -UserAgent "InnoSetup/6.2" -ErrorAction Stop
              Write-Host "[OK] $u -> HTTP $($resp.StatusCode)"
            } catch {
              Write-Host "[NOTE] Endpoint check: $u ($($_.Exception.Message))"
            }
          }

      - name: Verify Release Artifacts & Generate Checksums
        run: npm run verify-release
        working-directory: desktop

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-release-artifacts
          path: |
            desktop/dist-release/SmartCleaner-Setup.exe
            desktop/dist-release/SmartCleaner-Setup-*.exe
            desktop/dist-release/SmartCleaner-Portable-*.zip
            desktop/dist-release/latest.yml
            desktop/dist-release/portable.yml
            desktop/dist-release/checksums.txt
            desktop/dist-release/checksums.json
          if-no-files-found: warn

      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist-release/SmartCleaner-Setup.exe
            desktop/dist-release/SmartCleaner-Setup-*.exe
            desktop/dist-release/SmartCleaner-Portable-*.zip
            desktop/dist-release/latest.yml
            desktop/dist-release/portable.yml
            desktop/dist-release/checksums.txt
            desktop/dist-release/checksums.json
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
