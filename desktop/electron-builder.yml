appId: com.smartcleaner.app
productName: Smart Windows Cleaner
copyright: Copyright © 2026 Abdelrahman Aboelsaad

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: ../core/target/release
    to: bin
    filter:
      - smart-cleaner-core
      - smart-cleaner-core.exe

extraFiles:
  - from: ../installer/portable.dat
    to: portable.dat
  - from: ../installer/README-Portable.txt
    to: README-Portable.txt

# Feed metadata contract consumed by bootstrapper and electron-updater
publish:
  - provider: generic
    url: https://github.com/Aboelsaad77/smart-windows-cleaner/releases/latest/download/

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  executableName: SmartCleaner
  publisherName: Abdelrahman Aboelsaad
  legalTrademarks: Smart Windows Cleaner
  artifactName: SmartCleaner-Portable-${version}.${ext}

nsis:
  guid: B2E15C76-9F02-4A8E-9807-6B1A424EF55D
  artifactName: SmartCleaner-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Smart Windows Cleaner
  createDesktopShortcut: always
  createStartMenuShortcut: true
  uninstallDisplayName: Smart Windows Cleaner
  runAfterFinish: false
